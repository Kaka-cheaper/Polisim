<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-primary: #050506;
            --color-bg-secondary: #1c1c1f;
            --color-bg-tertiary: #232326;
            --color-bg-panel: #0c0d0e;
            --color-bg-accent: #18182f;
            --color-text-primary: #f7f8f8;
            --color-text-secondary: #d0d6e0;
            --color-text-tertiary: #8a8f98;
            --color-text-muted: #62666d;
            --color-accent: #7170ff;
            --color-accent-hover: #828fff;
            --color-border: #23252a;
            --color-border-light: #34343a;
            --color-status-success: #27a644;
            --color-status-danger: #eb5757;
            --color-status-warning: #f0bf00;
            --color-status-info: #4ea7fc;
            --color-polisim-paused: #f0bf00;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .liquid-glass {
            background: rgba(28, 28, 31, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .shadow-glow-accent {
            box-shadow: 0 0 20px -4px rgba(113, 112, 255, 0.35);
        }

        .shadow-focus {
            box-shadow: 0 0 0 3px rgba(94, 105, 209, 0.4);
        }

        .inner-highlight {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
        }

        .gradient-hero-glow {
            background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(113, 112, 255, 0.08) 0%, rgba(113, 112, 255, 0.03) 40%, transparent 70%);
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: var(--color-bg-panel);
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: var(--color-border-light);
            border-radius: 3px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-muted);
        }
    </style>
</head>

            if (v === null || v === undefined) return '—';
            if (typeof v === 'number') {
                return Number.isInteger(v) ? String(v) : v.toFixed(2);

            if (typeof v === 'boolean') return v ? 'true' : 'false';
            if (typeof v === 'string') return v;
            return JSON.stringify(v);

            if (lower.includes('reputation') || lower.includes('repu')) return '📈';
            if (lower.includes('trust')) return '🤝';
            return '▫️';
        };

        const computeDiff = (prev, curr) => {
            if (typeof prev === 'number' && typeof curr === 'number') {
                const d = curr - prev;
                if (d === 0) return { sign: null, delta: null };
                return { sign: d > 0 ? '↑' : '↓', delta: Math.abs(d) };
            }
            return { sign: null, delta: null };

                            </div>

        const ControlBar = ({ status, currentTick, totalTicks, speed, onPause, onResume, onStep, onExit }) => {
            const isRunning = status === 'running';
            const isPaused = status === 'paused';
            const isTerminal = status === 'finished';

            return `
                <div class="sticky top-14 z-40 flex flex-wrap items-center gap-3 border-b border-gray-800 bg-gray-900/90 px-4 py-3" style="backdrop-filter: blur(12px);">
                    <span class="font-mono text-sm text-white">${t('control_bar.tick_label', { current: currentTick, total: totalTicks })}</span>
                    
                    <span class="flex items-center gap-1.5 rounded-sm bg-gray-800/50 px-2 py-0.5 text-xs font-medium ${isRunning ? 'text-green-500' : isPaused ? 'text-yellow-500' : 'text-gray-500'}">
                        ${isPaused && '<span class="inline-block h-1.5 w-1.5 animate-pulse rounded-circle bg-yellow-500"></span>'}
                        ${isRunning && '<span class="inline-block h-1.5 w-1.5 animate-pulse rounded-circle bg-green-500"></span>'}
                        ${t(`control_bar.status.${status}`)}
                    </span>

                    ${isRunning && `
                        <button onclick="${onPause}" class="rounded-md border border-gray-700 bg-gray-800/50 px-3 py-1.5 text-sm font-medium text-white transition-all hover:-translate-y-px hover:border-${currentLocale === 'zh' ? 'purple-500' : '#7170ff'} hover:bg-gray-700">
                            ⏸ ${t('control_bar.pause')}
                        </button>
                    `}
                    ${!isRunning && !isTerminal && `
                        <button onclick="${onResume}" class="rounded-full bg-${currentLocale === 'zh' ? 'purple-600' : '#7170ff'} px-3 py-1.5 text-sm font-medium text-white transition-all hover:scale-105 hover:bg-${currentLocale === 'zh' ? 'purple-500' : '#828fff'} hover:shadow-glow-accent active:scale-95">
                            ▶ ${t('control_bar.resume')}

                    <button onclick="${onStep}" ${!isPaused ? 'disabled' : ''} class="rounded-md border border-gray-700 bg-gray-800/50 px-3 py-1.5 text-sm font-medium text-white transition-all hover:-translate-y-px hover:border-${currentLocale === 'zh' ? 'purple-500' : '#7170ff'} hover:bg-gray-700 ${!isPaused ? 'opacity-50 cursor-not-allowed' : ''}">

        const EntityCard = ({ entry, onIntervene }) => {
            const { id, type, decisionMode, attributes, prevAttributes, latestDecision, latestAction } = entry;
            const reason = latestDecision?.payload?.reason || '';
            const actionLabel = latestAction?.payload?.action || '';

            return `
                <div class="liquid-glass flex flex-col rounded-xl border border-gray-700 p-4">
                    <header class="flex items-center gap-2">
                        <span class="text-xl">${entityTypeEmoji(type)}</span>

                        <span class="ml-auto rounded-sm bg-gray-800/50 px-2 py-0.5 font-mono text-xs text-gray-500">

                    </header>
                    <hr class="my-3 border-gray-800" />
                    <ul class="space-y-1">
                        ${Object.entries(attributes).map(([name, value]) => {

                            return `
                                <li class="flex items-center gap-2 text-sm text-gray-400">
                                    <span>${attributeEmoji(name)}</span>
                                    <span class="font-mono text-gray-500">${name}</span>

                    ${decisionMode === 'llm' && latestDecision && reason ? `
                        <div class="mt-3 rounded-lg bg-gray-800/50 p-3">

                    <button onclick="${onIntervene}" class="mt-4 self-start rounded-md border border-gray-700 bg-gray-800/50 px-3 py-1.5 text-xs font-medium text-gray-400 transition-all hover:-translate-y-px hover:border-${currentLocale === 'zh' ? 'purple-500' : '#7170ff'} hover:bg-gray-700 hover:text-white">

        const EntityCardLayout = ({ entries, environment }) => {
            const envEntries = environment ? Object.entries(environment) : [];

            return `
                <div>
                    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">

                    ${envEntries.length > 0 ? `
                        <section class="mt-6 rounded-lg border border-gray-800 bg-gray-900/50 px-4 py-3">

                                        <span class="text-gray-400">=</span>

                        </section>
                    ` : ''}

        const EventStreamLayout = ({ entries, events }) => {
            const grouped = {};
            events.forEach(e => {

                grouped[e.tick].push(e);
            });

            const formatEvent = (e) => {
                const actor = e.actor_id || 'system';
                switch (e.kind) {
                    case 'decision_proposed':
                        return `${actor} proposed ${e.payload.action} (${e.payload.mode})`;
                    case 'action_executed':
                        return `${actor} executed ${e.payload.action}`;
                    case 'attribute_changed':
                        return `${actor} ${e.payload.name}: ${e.payload.old_value} -> ${e.payload.new_value}`;
                    case 'run_finished':
                        return 'Simulation finished';

                        return `${actor}: ${e.kind}`;

            };

            return `
                <div class="grid grid-cols-1 gap-4 md:grid-cols-[16rem_1fr]">

                                .slice(0, 2);

                                <div class="rounded-lg border border-gray-700 bg-gray-800/50 px-3 py-2">

                                        <span class="font-mono text-sm font-semibold text-white">${entry.id}</span>
                                        <span class="rounded bg-gray-900/50 px-1.5 py-0.5 text-xs font-medium text-gray-500">${t(`entity_card.decision_mode_label.${entry.decisionMode}`)}</span>

                                    ${numericKeys.length > 0 ? `

                                                <li class="text-gray-500">${k} = <span class="text-gray-400">${formatValue(v)}</span></li>
                                            `).join('')}
                                        </ul>
                                    ` : ''}
                                    <button onclick="handleEntityClick('${entry.id}')" class="mt-2 w-full rounded border border-gray-700 bg-gray-800/50 px-2 py-1 text-xs font-medium text-gray-300 transition-colors hover:border-${currentLocale === 'zh' ? 'purple-500' : '#7170ff'} hover:bg-gray-700">

        const Running = () => {
            const [status, setStatus] = window.runState || { status: 'idle', currentTick: 0, speed: 1 };
            const runDetail = generateMockRunDetail(currentRunId);
            const events = generateMockEvents(status.currentTick);
            const snapshots = generateMockSnapshots(status.currentTick);

            const entries = runDetail.scenario.entities.map(e => {
                const latestSnapshot = snapshots.at(-1);
                const prevSnapshot = snapshots.length >= 2 ? snapshots.at(-2) : null;
                const summary = latestSnapshot?.entity_state_summary || {};
                const prevSummary = prevSnapshot?.entity_state_summary || {};
                
                return {
                    id: e.id,
                    type: e.type,
                    decisionMode: runDetail.world.entity_types[e.type]?.decision_mode || 'rule',
                    attributes: summary[e.id] || e.attributes || {},
                    prevAttributes: prevSummary[e.id] || null,
                    latestDecision: events.findLast(ev => ev.kind === 'decision_proposed' && ev.actor_id === e.id),
                    latestAction: events.findLast(ev => ev.kind === 'action_executed' && ev.actor_id === e.id)
                };
            });

            const environment = snapshots.at(-1)?.environment_state || runDetail.scenario.environment;

            const handlePause = () => setStatus({ ...status, status: 'paused' });

                    setStatus({ ...status, status: 'paused' });
                }
                alert(`干预实体: ${id}\n\n此功能在演示版中不可用。`);
            };

            window.runState = { status, setStatus };

            return `
                ${ControlBar({
                    status: status.status,
                    currentTick: status.currentTick,
                    totalTicks: runDetail.summary.total_ticks,
                    speed: status.speed,
                    onPause: 'handlePause()',
                    onResume: 'handleResume()',
                    onStep: 'handleStep()',
                    onExit: 'handleExit()'
                })}
                <main class="mx-auto max-w-7xl px-6 py-6">
                    ${EntityCardLayout({ entries, environment })}
                </main>
            `;
        };

        const Finished = () => {
            const runDetail = generateMockRunDetail(currentRunId);
            const analysis = MOCK_ANALYSIS;

            const handleBackToGallery = () => navigateToGallery();
            const handleRerun = () => {
                currentRunId = `demo-run-${Date.now()}`;
                window.runState = { status: { status: 'idle', currentTick: 0, speed: 1 }, setStatus: (s) => window.runState.status = s };
                navigateToPreRun();
            };

            return `
                <main class="mx-auto max-w-7xl px-6 py-12">
                    <header class="flex flex-wrap items-start justify-between gap-4">
                        <div>
                            <h1 class="flex items-center gap-3 text-4xl font-semibold leading-tight text-white">
                                <span>✓</span>
                                ${t('finished.header.title')}
                            </h1>
                            <p class="mt-2 text-sm text-gray-500">runId: <span class="font-mono text-gray-400">${currentRunId}</span></p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="${handleBackToGallery}" class="rounded-md border border-gray-700 bg-gray-800/50 px-4 py-2 text-sm font-medium text-gray-300 transition-all hover:-translate-y-px hover:border-${currentLocale === 'zh' ? 'purple-500' : '#7170ff'} hover:bg-gray-700 hover:text-white">
                                ${t('finished.back_to_gallery')}
                            </button>
                            <button onclick="${handleRerun}" class="rounded-full bg-${currentLocale === 'zh' ? 'purple-600' : '#7170ff'} px-4 py-2 text-sm font-medium text-white transition-all hover:scale-105 hover:bg-${currentLocale === 'zh' ? 'purple-500' : '#828fff'} hover:shadow-glow-accent active:scale-95">
                                ${t('finished.rerun')}
                            </button>
                        </div>
                    </header>

                    <div class="mt-8">
                        <h2 class="text-sm font-medium uppercase tracking-wide text-gray-500">仿真指标</h2>
                        <div class="mt-4 grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-6">
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <p class="text-2xl font-semibold text-white">${analysis.phase_a.metrics.total_events}</p>
                                <p class="mt-1 text-xs text-gray-500">总事件数</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <p class="text-2xl font-semibold text-white">${analysis.phase_a.metrics.total_entities}</p>
                                <p class="mt-1 text-xs text-gray-500">实体数</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <p class="text-2xl font-semibold text-white">${analysis.phase_a.metrics.avg_decisions_per_tick}</p>
                                <p class="mt-1 text-xs text-gray-500">平均决策数/ tick</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <p class="text-2xl font-semibold text-white">${(analysis.phase_a.metrics.action_execution_rate * 100)}%</p>
                                <p class="mt-1 text-xs text-gray-500">动作执行率</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <p class="text-2xl font-semibold text-white">${analysis.phase_a.metrics.intervention_count}</p>
                                <p class="mt-1 text-xs text-gray-500">干预次数</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <p class="text-2xl font-semibold text-white">${analysis.phase_a.metrics.breakpoint_hits}</p>
                                <p class="mt-1 text-xs text-gray-500">断点命中</p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8">
                        <h2 class="text-sm font-medium uppercase tracking-wide text-gray-500">叙事报告</h2>
                        <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2">
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <h3 class="text-sm font-semibold text-gray-400">🌍 世界概览</h3>
                                <p class="mt-2 text-sm text-gray-300">${analysis.narrative.world_overview}</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <h3 class="text-sm font-semibold text-gray-400">📖 叙事总结</h3>
                                <p class="mt-2 text-sm text-gray-300">${analysis.narrative.narrative_summary}</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <h3 class="text-sm font-semibold text-gray-400">⚖️ 态势判断</h3>
                                <p class="mt-2 text-sm text-gray-300">${analysis.narrative.situation_judgement}</p>
                            </div>
                            <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                <h3 class="text-sm font-semibold text-gray-400">💡 行动建议</h3>
                                <ul class="mt-2 space-y-1">
                                    ${analysis.narrative.next_action_suggestions.map((s, i) => `
                                        <li class="text-sm text-gray-300">${i + 1}. ${s}</li>
                                    `).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8">
                        <h2 class="text-sm font-medium uppercase tracking-wide text-gray-500">转折点</h2>
                        <div class="mt-4 space-y-2">
                            ${analysis.phase_a.turning_points.map((tp, i) => `
                                <div class="rounded-lg border border-gray-700 bg-gray-800/50 px-4 py-3">
                                    <span class="font-mono text-sm text-purple-400">tick ${tp.tick}</span>
                                    <span class="ml-3 text-sm text-gray-300">${tp.description}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-8">
                            <h2 class="text-sm font-medium uppercase tracking-wide text-gray-500">实体轨迹</h2>
                            <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2">
                                ${Object.entries(analysis.phase_a.entity_trajectories).map(([entityId, data]) => `
                                    <div class="rounded-lg border border-gray-700 bg-gray-800/50 p-4">
                                        <h3 class="text-sm font-semibold text-gray-400">${entityTypeEmoji(entityId)} ${entityId}</h3>
                                        <div class="mt-3 space-y-3">
                                            ${Object.entries(data.attributes).map(([attr, values]) => `
                                                <div>
                                                    <p class="text-xs text-gray-500">${attributeEmoji(attr)} ${attr}</p>
                                                    <div class="mt-1 flex items-end gap-1 h-12">
                                                        ${values.map((v, i) => `
                                                            <div class="flex-1 bg-gray-700 rounded-t transition-all" style="height: ${(v / 100) * 100}%; background-color: ${i % 2 === 0 ? '#7170ff' : '#828fff'}"></div>
                                                        `).join('')}
                                                    </div>
                                                    <p class="mt-1 text-xs text-gray-600 font-mono">${values.join(' → ')}</p>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </main>
                `;
        };

        const renderApp = () => {
            const app = document.getElementById('app');
            if (!app) return;

            let content = '';
            switch (currentRoute) {
                case ROUTES.GALLERY:
                    content = Gallery();
                    break;
                case ROUTES.PRERUN:
                    content = PreRun();
                    break;
                case ROUTES.RUNNING:
                    content = Running();
                    break;
                case ROUTES.FINISHED:
                    content = Finished();
                    break;
            }

            app.innerHTML = `${TopBar()}${content}`;

            if (currentRoute === ROUTES.RUNNING && window.runState?.status.status === 'running') {
                const interval = setInterval(() => {
                    if (!window.runState) return;
                    const { status, setStatus } = window.runState;
                    if (status.status === 'running' && status.currentTick < 5) {
                        setStatus({ ...status, currentTick: status.currentTick + 1 });
                        renderApp();
                    } else if (status.currentTick >= 5) {
                        setStatus({ ...status, status: 'finished' });
                        clearInterval(interval);
                        navigateToFinished();
                    }
                }, 1000 / status.speed);
                window.runState.interval = interval;
            }
        };

        const navigateToGallery = () => {
            if (window.runState?.interval) {
                clearInterval(window.runState.interval);
            }
            currentRoute = ROUTES.GALLERY;
            currentRunId = null;
            currentScenario = null;
            window.runState = null;
            renderApp();
        };

        const navigateToPreRun = () => {
            currentRoute = ROUTES.PRERUN;
            renderApp();
        };

        const navigateToRunning = () => {
            window.runState = { 
                status: { status: 'running', currentTick: 0, speed: 1 }, 
                setStatus: (s) => { window.runState.status = s; }
            };
            currentRoute = ROUTES.RUNNING;
            renderApp();
        };

        const navigateToFinished = () => {
            if (window.runState?.interval) {
                clearInterval(window.runState.interval);
            }
            currentRoute = ROUTES.FINISHED;
            renderApp();
        };

        const setSpeed = (speed) => {
            if (window.runState) {
                window.runState.status.speed = speed;
                if (window.runState.interval) {
                    clearInterval(window.runState.interval);
                }
                renderApp();
            }
        };

        const handleStartScenario = (scenario) => {
            currentScenario = scenario;
            currentRunId = `demo-run-${Date.now()}`;
            navigateToPreRun();
        };

        const handlePause = () => {
            if (window.runState?.interval) {
                clearInterval(window.runState.interval);
            }
            window.runState.status.status = 'paused';
            renderApp();
        };

        const handleResume = () => {
            window.runState.status.status = 'running';
            renderApp();
        };

        const handleStep = () => {
            if (window.runState && window.runState.status.currentTick < 5) {
                window.runState.status.currentTick += 1;
                renderApp();
            }
        };

        const handleExit = () => {
            navigateToGallery();
        };

        const handleEntityClick = (id) => {
            if (window.runState?.status.status === 'running') {
                handlePause();
            }
            alert(`干预实体: ${id}\n\n此功能在演示版中不可用。`);
        };

        document.addEventListener('DOMContentLoaded', renderApp);
