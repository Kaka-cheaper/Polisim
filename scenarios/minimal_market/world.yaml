# Polisim Walkthrough 最小世界定义
#
# 对应 `docs/01-requirements/最小示例Walkthrough.md` 第三节"第一步：写世界定义"。
# 这是本项目的第一份 world.yaml——既是 walkthrough 的可执行载体，也是回归测试
# 用来验证 schema / loader / rules / runtime 全链路的锚点。
#
# 配套文件：
#   - scenarios/minimal_market/scenario.yaml
#   - rules/minimal_market.py

version: "0.1"

world:
  id: minimal-market
  name: 最小市场推演（walkthrough）
  description: 2 实体类型 + 2 动作 + 1 消息 + 1 环境变量，验证分层最小闭环

entity_types:

  Company:
    description: 市场主体（walkthrough 中唯一需要 LLM 决策的实体）
    decision_mode: llm
    activation:
      on_message: true
      decision_interval: 1
    attributes:
      cash:
        type: number
        min: 0
        default: 100
      reputation:
        type: number
        min: 0
        max: 100
        default: 50
    actions:
      - promote
      - do_nothing

  Regulator:
    description: 监管方；walkthrough 中不主动决策，政策信号通过 scheduled_event 注入
    decision_mode: rule
    activation:
      on_message: false
      decision_interval: 1
    attributes:
      strictness:
        type: number
        min: 0
        max: 100
        default: 50
    actions:
      - do_nothing

message_types:

  policy_signal:
    description: 监管方发出的政策信号
    delivery: broadcast
    payload:
      strength:
        type: number
      directive:
        type: string

action_types:

  promote:
    description: 企业发起宣传行动。前置条件 cash >= budget（由 rules/minimal_market.py 校验）
    actor_types: [Company]
    params:
      budget:
        type: number
        required: true
        description: 推广预算（货币单位），必须 ≤ 当前 cash。LLM 应权衡 cash 与策略选值
        default: 10
        min: 0
    effects:
      - kind: self_attribute

  do_nothing:
    description: 无动作；作为 fallback_action 兜底
    actor_types: [Company, Regulator]
    params: {}
    effects: []

environment:
  variables:
    policy_pressure:
      type: number
      min: 0
      max: 100
      default: 20

defaults:
  conflict_resolution: both
  max_messages_per_tick: 100
  fallback_action: do_nothing
  action_effect_order:
    - self_attribute
    - relation
    - environment
    - message
