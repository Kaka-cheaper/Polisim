# Polisim 包元数据 + 依赖声明
#
# 创建于 2026-04-24（session 12，架构保健）。目标：
#
# 1. 让新开发机一键 `pip install -e .[dev]` 就能跑测试
# 2. 锁定关键依赖主版本号，防止 pydantic 3.x 类库升级破坏 model_validator 签名
# 3. 声明 Python 版本下限（代码使用 PEP 604 的 `X | None` 语法，最低 3.10）
# 4. 为未来 CI / 发布 / 命令行入口留钩子
#
# 不做的事：不引入 Poetry/Hatch 等高阶工具链；不写 lock file；不配置 lint/format。

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polisim"
version = "0.1.1"
description = "分层驱动的通用多实体仿真引擎（Polisim）—— v0.1.1 引擎严谨化 + LLM 增强分析"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Kaka-cheaper" },
]
keywords = ["simulation", "multi-agent", "llm", "tick-based"]

# 运行时依赖。保持最小——凡是 AGENTS.md 允许范围内用到的库都列在这里。
# 版本约束策略：锁定主版本上限，允许次版本与补丁升级。
# 依据：
#   pydantic 2.x  —— ConfigDict、model_validator(mode="after") 依赖 v2 API
#   pyyaml        —— YAML 文件加载
#   jsonschema    —— world / scenario 的 JSON Schema 校验
#   openai 1.50+  —— Phase B.2 真实 LLM provider；response_format/parse 稳定
#   fastapi 0.110+ + uvicorn[standard] 0.27+ —— v0.2 server (D-017)；
#                    自动 OpenAPI、Pydantic 直接做 response_model、async ws 支持
dependencies = [
  "pydantic>=2.0,<3.0",
  "pyyaml>=6.0,<7.0",
  "jsonschema>=4.0,<5.0",
  "openai>=1.50,<2.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
# 开发 / 测试依赖。`pip install -e .[dev]` 可一次装齐。
# httpx —— FastAPI TestClient 依赖；用于 server 路由测试（D-017 第九节）
dev = [
  "pytest>=7.0,<9.0",
  "httpx>=0.27,<1.0",
]

[project.urls]
# 占位：未来补上仓库 URL 后改这里

[tool.setuptools]
# 我们采用 implicit namespace package（目录下无 __init__.py），setuptools 需要
# 显式列出子包——防止把 tests / docs / runs 等目录误打进 wheel。
packages = [
  "cli",
  "core",
  "core.providers",
  "models",
  "rules",
  # v0.2 server 层（D-017）
  "server",
  "server.api",
  "server.api.v1",
  "server.api.v1.middlewares",
  "server.api.v1.routes",
  "server.services",
]

[tool.pytest.ini_options]
# 保持与目前手动 `python -m pytest tests/` 一致的行为
testpaths = ["tests"]
python_files = ["test_*.py"]
# 便于测试中用标注引用验收项与决策号
markers = [
  "d_decision: 标记覆盖某条 D-xxx 决策的测试",
  "acceptance: 标记对应 docs/01-requirements/验收标准.md 某节的测试",
]
